spring.application.name=th-company

server.port=${PORT:8080}

# 비밀번호 등 로컬 전용 설정은 프로젝트 루트의 application-local.properties 에 둔다 (git 제외)
spring.config.import=optional:file:./application-local.properties

# DB (MariaDB) - 환경변수 DB_URL / DB_USERNAME / DB_PASSWORD 로 덮어쓸 수 있음
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/th_company}
spring.datasource.username=${DB_USERNAME:th_company}
spring.datasource.password=${DB_PASSWORD:}

# JPA - 개발 초기에는 update 로 테이블 자동 생성, 운영 전에 validate + 마이그레이션 도구로 전환
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# 첨부파일 저장 위치와 크기 제한
app.upload-dir=${UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=100MB

# MariaDB 드라이버 URL 에 비밀번호가 포함되어 Hibernate 시작 로그에 찍히므로 숨긴다
logging.level.org.hibernate.orm.connections.pooling=WARN
