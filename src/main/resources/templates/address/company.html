<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('사내 주소록')}"></head>
<body>
<header th:replace="~{fragments/layout :: topbar('address')}"></header>
<div class="layout">
	<main class="content">
		<div class="board-layout">
			<nav th:replace="~{address/fragments :: nav}"></nav>

			<section class="board-main">
				<div class="board-head">
					<div>
						<h2>사내 주소록</h2>
						<p class="board-desc">재직 중인 임직원 연락처입니다. 왼쪽에서 부서를 고르거나 회사 전체에서 검색하세요.</p>
					</div>
				</div>

				<div class="alert alert-info" th:if="${message}" th:text="${message}"></div>
				<div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

				<form class="address-search" th:action="@{/address/company}" method="get">
					<input type="search" name="q" th:value="${q}" placeholder="회사 전체에서 이름, 부서, 이메일, 전화번호 검색">
					<button type="submit" class="btn-secondary">검색</button>
					<a class="btn-secondary" th:if="${searching}" th:href="@{/address/company}">검색 지우기</a>
				</form>

				<div class="org org-manage">
					<section th:replace="~{fragments/org :: deptTree(${org.departments}, ${org.selectedId}, ${org.noDeptCount}, '/address/company')}"></section>

					<section class="org-members">
						<div class="org-members-head">
							<h3 th:text="${org.title}">개발1팀</h3>
							<span class="today" th:text="${#lists.size(org.members)} + '명'">0명</span>
						</div>
					<table class="post-table address-table">
						<thead>
						<tr>
							<th class="col-name">이름</th>
							<th class="col-grade">직급/직책</th>
							<th class="col-dept" th:if="${searching}">부서</th>
							<th class="col-email">이메일</th>
							<th class="col-phone">전화</th>
							<th class="col-act"></th>
						</tr>
						</thead>
						<tbody>
						<tr th:each="e : ${org.members}">
							<td class="col-name">
								<span class="avatar avatar-sm">
									<img th:if="${e.photoUrl}" th:src="@{${e.photoUrl}}" alt="" loading="lazy">
									<th:block th:unless="${e.photoUrl}" th:text="${e.initial()}">김</th:block>
								</span>
								<strong th:text="${e.name}">김도현</strong>
							</td>
							<td class="col-grade">
								<span th:text="${e.gradeName} ?: '-'">과장</span>
								<span class="duty-tag" th:if="${e.dutyName}" th:text="${e.dutyName}">팀장</span>
							</td>
							<td class="col-dept" th:if="${searching}" th:text="${e.deptName} ?: '-'">개발1팀</td>
							<td class="col-email">
								<a th:if="${e.email}" th:href="'mailto:' + ${e.email}" th:text="${e.email}">mail</a>
								<span th:unless="${e.email}">-</span>
							</td>
							<td class="col-phone">
								<a th:if="${e.phone}" th:href="'tel:' + ${e.phone}" th:text="${e.phone}">010</a>
								<span th:unless="${e.phone}">-</span>
							</td>
							<td class="col-act">
								<form th:action="@{/address/personal/add-employee}" method="post">
									<input type="hidden" name="memberId" th:value="${e.memberId}">
									<input type="hidden" name="back" th:value="${searching} ? @{/address/company(q=${q})} : @{/address/company(dept=${org.selectedId})}">
									<button type="submit" class="btn-link" title="개인 주소록에 추가">+ 내 주소록</button>
								</form>
							</td>
						</tr>
						</tbody>
					</table>
					<p th:if="${#lists.isEmpty(org.members)}" class="empty post-empty"
					   th:text="${searching} ? '검색 결과가 없습니다.' : '이 부서에 재직자가 없습니다.'">검색 결과가 없습니다.</p>
					</section>
				</div>
			</section>
		</div>
	</main>
</div>
</body>
</html>
