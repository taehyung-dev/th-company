<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('게시판 관리')}"></head>
<body>
<header th:replace="~{admin/fragments :: header}"></header>
<div class="layout">
	<nav th:replace="~{admin/fragments :: sidebar}"></nav>

	<main class="content">
		<div class="content-head">
			<h2>게시판 관리</h2>
			<span class="today">폴더로 게시판을 묶어 트리로 구성합니다.</span>
		</div>
		<th:block th:replace="~{admin/fragments :: alerts}"></th:block>

		<div class="split">
			<section class="panel table-wrap">
				<table class="table">
					<thead>
					<tr><th>이름</th><th>종류</th><th class="num">글</th><th class="num">순서</th><th>권한</th><th>상태</th><th></th></tr>
					</thead>
					<tbody>
					<tr th:each="b : ${rows}" th:classappend="${!b.enabled} ? 'row-disabled'">
						<td>
							<span th:style="'padding-left:' + ${b.depth * 20} + 'px'">
								<span class="tree-mark" th:if="${b.depth > 0}">└</span>
								<strong th:if="${b.folder}" th:text="${b.name}">전사</strong>
								<span th:unless="${b.folder}" th:text="${b.name}">공지사항</span>
							</span>
						</td>
						<td th:text="${b.type.label}">게시판</td>
						<td class="num" th:text="${b.folder} ? '' : ${b.postCount}">0</td>
						<td class="num" th:text="${b.sortOrder}">0</td>
						<td th:text="${b.folder} ? '' : (${b.adminOnlyWrite} ? '관리자만 글쓰기' : '전체')">전체</td>
						<td><span class="tag" th:classappend="${b.enabled} ? 'tag-on' : 'tag-off'"
						          th:text="${b.enabled} ? '사용' : '사용 안 함'">사용</span></td>
						<td class="actions">
							<a th:href="@{/admin/boards(edit=${b.id})}">수정</a>
							<form th:action="@{/admin/boards/{id}/delete(id=${b.id})}" method="post"
							      onsubmit="return confirm('삭제할까요?')">
								<button type="submit" class="btn-link danger">삭제</button>
							</form>
						</td>
					</tr>
					<tr th:if="${#lists.isEmpty(rows)}">
						<td colspan="7" class="empty">등록된 게시판이 없습니다. 오른쪽에서 폴더나 게시판을 추가하세요.</td>
					</tr>
					</tbody>
				</table>
			</section>

			<section class="panel">
				<h3 th:text="${form.id == null} ? '추가' : '수정'">추가</h3>
				<form th:action="@{/admin/boards}" th:object="${form}" method="post" class="form">
					<input type="hidden" th:field="*{id}">

					<label for="type">종류</label>
					<select th:field="*{type}" th:disabled="${form.id != null}">
						<option th:each="t : ${types}" th:value="${t}" th:text="${t.label}">게시판</option>
					</select>
					<input type="hidden" th:if="${form.id != null}" th:field="*{type}">

					<label for="name">이름</label>
					<input type="text" th:field="*{name}" maxlength="50" required>
					<p class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>

					<label for="parentId">상위 폴더</label>
					<select th:field="*{parentId}">
						<option value="">(최상위)</option>
						<option th:each="b : ${rows}" th:if="${b.folder}" th:value="${b.id}"
						        th:disabled="${b.id == form.id}"
						        th:text="${#strings.repeat('　', b.depth) + b.name}">전사</option>
					</select>

					<label for="description">설명</label>
					<input type="text" th:field="*{description}" maxlength="200" placeholder="게시판 상단에 표시 (선택)">
					<p class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></p>

					<label for="sortOrder">정렬 순서</label>
					<input type="number" th:field="*{sortOrder}" min="0">

					<label class="check" th:if="${form.type.name() == 'BOARD'}">
						<input type="checkbox" th:field="*{adminOnlyWrite}"> 관리자만 글쓰기 (공지용, 홈 화면 공지사항에 표시)
					</label>

					<label class="check" th:if="${form.id != null}">
						<input type="checkbox" th:field="*{enabled}"> 사용
					</label>

					<div class="form-buttons">
						<a class="btn-secondary" th:if="${form.id != null}" th:href="@{/admin/boards}">취소</a>
						<button type="submit" class="btn-primary">저장</button>
					</div>
				</form>
			</section>
		</div>
	</main>
</div>
</body>
</html>
