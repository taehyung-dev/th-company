<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head(${type.label} + ' 관리')}"></head>
<body>
<header th:replace="~{admin/fragments :: header}"></header>
<div class="layout">
	<nav th:replace="~{admin/fragments :: sidebar}"></nav>

	<main class="content">
		<div class="content-head">
			<h2 th:text="${type.label} + ' 관리'">직급 관리</h2>
			<span class="today" th:text="${type.description}">설명</span>
		</div>
		<th:block th:replace="~{admin/fragments :: alerts}"></th:block>

		<div class="split">
			<section class="panel">
				<table class="table">
					<thead>
					<tr><th class="num">순서</th><th th:text="${type.label}">직급</th><th>상태</th><th></th></tr>
					</thead>
					<tbody>
					<tr th:each="c : ${codes}" th:classappend="${!c.enabled} ? 'row-disabled'">
						<td class="num" th:text="${c.sortOrder}">1</td>
						<td th:text="${c.name}">사원</td>
						<td><span class="tag" th:classappend="${c.enabled} ? 'tag-on' : 'tag-off'"
						          th:text="${c.enabled} ? '사용' : '사용 안 함'">사용</span></td>
						<td class="actions">
							<a th:href="@{/admin/codes/{p}(p=${type.path}, edit=${c.id})}">수정</a>
							<form th:action="@{/admin/codes/{p}/{id}/delete(p=${type.path}, id=${c.id})}" method="post"
							      onsubmit="return confirm('삭제할까요?')">
								<button type="submit" class="btn-link danger">삭제</button>
							</form>
						</td>
					</tr>
					<tr th:if="${#lists.isEmpty(codes)}">
						<td colspan="4" class="empty" th:text="'등록된 ' + ${type.label} + '이(가) 없습니다.'">없음</td>
					</tr>
					</tbody>
				</table>
				<p class="hint">정렬 순서가 작을수록 상위에 표시됩니다.</p>
			</section>

			<section class="panel">
				<h3 th:text="${type.label} + (${form.id == null} ? ' 추가' : ' 수정')">직급 추가</h3>
				<form th:action="@{/admin/codes/{p}(p=${type.path})}" th:object="${form}" method="post" class="form">
					<input type="hidden" th:field="*{id}">

					<label for="name">이름</label>
					<input type="text" th:field="*{name}" maxlength="50" required>
					<p class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>

					<label for="sortOrder">정렬 순서</label>
					<input type="number" th:field="*{sortOrder}" min="0">
					<p class="field-error" th:if="${#fields.hasErrors('sortOrder')}" th:errors="*{sortOrder}"></p>

					<label class="check" th:if="${form.id != null}">
						<input type="checkbox" th:field="*{enabled}"> 사용
					</label>

					<div class="form-buttons">
						<a class="btn-secondary" th:if="${form.id != null}" th:href="@{/admin/codes/{p}(p=${type.path})}">취소</a>
						<button type="submit" class="btn-primary">저장</button>
					</div>
				</form>
			</section>
		</div>
	</main>
</div>
</body>
</html>
