<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:text="${title} + ' - 관리자'">관리자</title>
	<link rel="stylesheet" th:href="@{/css/app.css}">
	<link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<!-- 상단 바 + 구분 메뉴. 구분을 고르면 좌측 메뉴가 그 구분의 메뉴로 바뀐다 -->
<div th:fragment="header" class="site-header admin-header">
<header class="topbar admin-topbar">
	<a class="brand" th:href="@{/}">TH Company <span class="brand-sub">관리자</span></a>
	<div class="topbar-right">
		<span class="user-name" th:title="${currentUser}"><strong th:text="${currentUserName}">홍길동</strong> 님</span>
		<a class="icon-btn" th:href="@{/}" title="홈으로" aria-label="홈으로">
			<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg>
		</a>
		<form th:action="@{/logout}" method="post">
			<button type="submit" class="icon-btn" title="로그아웃" aria-label="로그아웃">
				<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>
			</button>
		</form>
	</div>
</header>
<nav class="menubar admin-menubar" th:with="current=${adminNav.current(menu)}">
	<a th:each="s : ${adminNav.sections}" th:href="@{${s.url()}}" th:text="${s.label}"
	   th:classappend="${s == current} ? 'active'">인사정보</a>
</nav>
</div>

<!-- 지금 구분의 메뉴만. 어떤 구분이 보이는지는 AdminModelAdvice 가 권한으로 정한다 -->
<nav th:fragment="sidebar" class="sidebar admin-sidebar" th:with="section=${adminNav.current(menu)}">
	<div class="menu-group" th:text="${section.label}">인사정보</div>
	<a th:each="i : ${section.items}" th:href="@{${i.url}}" th:text="${i.label}"
	   th:classappend="${menu == i.key} ? 'active'">사용자 관리</a>
</nav>

<th:block th:fragment="alerts">
	<div class="alert alert-info" th:if="${message}" th:text="${message}">저장했습니다.</div>
	<div class="alert alert-error" th:if="${error}" th:text="${error}">오류</div>
</th:block>

</body>
</html>
