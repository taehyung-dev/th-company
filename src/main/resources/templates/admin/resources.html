<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head(${kind.label} + ' 관리')}"></head>
<body>
<header th:replace="~{admin/fragments :: header}"></header>
<div class="layout">
	<nav th:replace="~{admin/fragments :: sidebar}"></nav>

	<main class="content">
		<div class="content-head">
			<h2 th:text="${kind.label} + ' 관리'">회의실 관리</h2>
			<span class="today" th:if="${kind.hasSubTypes()}">자원예약 메뉴에서 예약할 비품·장비와 차량을 관리합니다.</span>
			<span class="today" th:unless="${kind.hasSubTypes()}">회의실예약 메뉴에서 예약할 회의실을 관리합니다.</span>
		</div>
		<th:block th:replace="~{admin/fragments :: alerts}"></th:block>

		<div class="split">
			<section class="panel table-wrap">
				<table class="table">
					<thead>
					<tr>
						<th th:if="${kind.hasSubTypes()}">종류</th><th>이름</th><th>위치</th><th class="num">인원</th>
						<th class="num">예약</th><th class="num">순서</th><th>상태</th><th></th>
					</tr>
					</thead>
					<tbody>
					<tr th:each="r : ${rows}" th:classappend="${!r.enabled} ? 'row-disabled'">
						<td th:if="${kind.hasSubTypes()}"><span class="res-type" th:classappend="'res-' + ${r.type.css}" th:text="${r.type.label}">차량</span></td>
						<td>
							<strong th:text="${r.name}">대회의실</strong>
							<div class="sub" th:if="${r.description}" th:text="${r.description}">빔프로젝터</div>
						</td>
						<td th:text="${r.location}">본관 3층</td>
						<td class="num" th:text="${r.capacity}">12</td>
						<td class="num" th:text="${r.reservationCount}">0</td>
						<td class="num" th:text="${r.sortOrder}">0</td>
						<td><span class="tag" th:classappend="${r.enabled} ? 'tag-on' : 'tag-off'"
						          th:text="${r.enabled} ? '사용' : '사용 안 함'">사용</span></td>
						<td class="actions">
							<a th:href="@{/admin/{k}(k=${kind.path},edit=${r.id})}">수정</a>
							<form th:action="@{/admin/{k}/{id}/delete(k=${kind.path},id=${r.id})}" method="post"
							      th:attr="data-confirm='\'' + ${r.name} + '\'을(를) 삭제할까요?'"
							      onsubmit="return confirm(this.dataset.confirm)">
								<button type="submit" class="btn-link danger">삭제</button>
							</form>
						</td>
					</tr>
					<tr th:if="${#lists.isEmpty(rows)}">
						<td th:colspan="${kind.hasSubTypes()} ? 8 : 7" class="empty"
						    th:text="'등록된 ' + ${kind.label} + '이(가) 없습니다. 오른쪽에서 추가하세요.'">등록된 회의실이(가) 없습니다.</td>
					</tr>
					</tbody>
				</table>
				<p class="hint">예약 기록이 있으면 삭제할 수 없습니다. 더 쓰지 않으면 수정에서 '사용'을 해제하세요 (지난 예약은 남습니다).</p>
			</section>

			<section class="panel">
				<h3 th:text="${kind.label} + (${form.id == null} ? ' 추가' : ' 수정')">회의실 추가</h3>
				<form th:action="@{/admin/{k}(k=${kind.path})}" th:object="${form}" method="post" class="form">
					<input type="hidden" th:field="*{id}">

					<th:block th:if="${kind.hasSubTypes()}">
						<label for="type">종류</label>
						<select th:field="*{type}">
							<option th:each="t : ${kind.types}" th:value="${t}" th:text="${t.label}">비품·장비</option>
						</select>
					</th:block>
					<input type="hidden" th:unless="${kind.hasSubTypes()}" th:field="*{type}">

					<label for="name">이름</label>
					<input type="text" th:field="*{name}" maxlength="50" required
					       th:placeholder="${kind.hasSubTypes()} ? '예: 빔프로젝터 1, 업무차량 1' : '예: 대회의실, 소회의실 1'">
					<p class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>

					<label for="location">위치</label>
					<input type="text" th:field="*{location}" maxlength="100" placeholder="예: 본관 3층 (선택)">
					<p class="field-error" th:if="${#fields.hasErrors('location')}" th:errors="*{location}"></p>

					<label for="capacity">수용 인원</label>
					<input type="number" th:field="*{capacity}" min="1" max="999"
					       th:placeholder="${kind.hasSubTypes()} ? '차량 탑승 인원 (선택)' : '선택'">
					<p class="field-error" th:if="${#fields.hasErrors('capacity')}" th:errors="*{capacity}"></p>

					<label for="description">설명</label>
					<input type="text" th:field="*{description}" maxlength="300" placeholder="갖춘 장비, 이용 안내 등 (선택)">
					<p class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></p>

					<label for="sortOrder">정렬 순서</label>
					<input type="number" th:field="*{sortOrder}" min="0">
					<p class="field-error" th:if="${#fields.hasErrors('sortOrder')}" th:errors="*{sortOrder}"></p>

					<label class="check" th:if="${form.id != null}">
						<input type="checkbox" th:field="*{enabled}"> 사용 (해제하면 새 예약을 받지 않습니다)
					</label>

					<div class="form-buttons">
						<a class="btn-secondary" th:if="${form.id != null}" th:href="@{/admin/{k}(k=${kind.path})}">취소</a>
						<button type="submit" class="btn-primary">저장</button>
					</div>
				</form>
			</section>
		</div>
	</main>
</div>
</body>
</html>
