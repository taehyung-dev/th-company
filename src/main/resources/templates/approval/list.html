<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${box.label})}"></head>
<body>
<header th:replace="~{fragments/layout :: topbar('approval')}"></header>
<div class="layout">
	<main class="content">
		<div class="board-layout">
			<nav th:replace="~{approval/fragments :: nav}"></nav>

			<section class="board-main">
				<div class="board-head">
					<div>
						<h2 th:text="${box.label}">미결문서</h2>
						<p class="board-desc" th:text="${box.description}">설명</p>
					</div>
				</div>

				<div class="alert alert-info" th:if="${message}" th:text="${message}"></div>
				<div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

				<!-- 문서를 체크하고 버튼을 누른다. 동작은 /js/approval-list.js -->
				<div class="list-tools" th:unless="${docs.empty}">
					<button type="button" class="btn-secondary" id="statusButton" th:attr="data-url=@{/approval/status}">결재상태 보기</button>
					<button type="button" class="btn-primary" id="bulkButton" th:if="${box.name() == 'PENDING'}">일괄결재</button>
					<span class="hint-inline" id="pickedCount"></span>
				</div>

				<div class="board-panel">
					<table class="post-table doc-table">
						<thead>
						<tr>
							<th class="col-check"><input type="checkbox" id="checkAll" aria-label="전체 선택" th:unless="${docs.empty}"></th>
							<th class="col-docno">문서번호</th>
							<th class="col-form">양식</th>
							<th>제목</th>
							<th class="col-author">기안자</th>
							<th class="col-when" th:text="${box.name() == 'COMPLETED'} ? '완료일' : (${box.name() == 'DRAFTS'} ? '저장일' : '기안일')">기안일</th>
							<th class="col-status">상태</th>
						</tr>
						</thead>
						<tbody>
						<tr th:each="d : ${docs.content}">
							<td class="col-check"><input type="checkbox" class="doc-check" th:value="${d.id}" th:attr="aria-label=${d.title} + ' 선택'"></td>
							<td class="col-docno" th:text="${d.docNo} ?: '-'">품의-2026-0001</td>
							<td class="col-form" th:text="${d.templateName}">품의서</td>
							<td class="col-title">
								<a th:href="${box.name() == 'DRAFTS'} ? @{/approval/docs/{id}/edit(id=${d.id})} : @{/approval/docs/{id}(id=${d.id}, from=${box.path})}"
								   th:text="${d.title}">제목</a>
							</td>
							<td class="col-author" th:text="${d.drafterName}">홍길동</td>
							<td class="col-when" th:text="${d.displayDate()}">2026.10.23</td>
							<td class="col-status">
								<span th:replace="~{approval/fragments :: status(${d.status})}"></span>
								<span class="current-approver" th:if="${d.currentApprover}" th:text="${d.currentApprover}">김팀장</span>
							</td>
						</tr>
						</tbody>
					</table>
					<p th:if="${docs.empty}" class="empty post-empty">문서가 없습니다.</p>
				</div>

				<nav class="pagination" th:if="${docs.totalPages > 1}">
					<a th:if="${docs.hasPrevious()}" th:href="@{/approval/box/{p}(p=${box.path}, page=${docs.number})}">‹</a>
					<a th:each="n : ${#numbers.sequence(1, docs.totalPages)}" th:text="${n}"
					   th:classappend="${n == docs.number + 1} ? 'current'"
					   th:href="@{/approval/box/{p}(p=${box.path}, page=${n})}">1</a>
					<a th:if="${docs.hasNext()}" th:href="@{/approval/box/{p}(p=${box.path}, page=${docs.number + 2})}">›</a>
				</nav>

				<!-- 결재상태 창: 체크한 문서의 결재 진행 상황 -->
				<dialog id="statusDialog" class="preview-dialog decide-dialog status-dialog">
					<div class="preview-bar">
						<strong>결재상태</strong>
						<button type="button" class="btn-secondary" data-close>닫기</button>
					</div>
					<div class="status-body" id="statusBody"></div>
				</dialog>

				<!-- 일괄결재 창. th:action 이 있어야 CSRF 토큰이 자동으로 들어간다 -->
				<dialog id="bulkDialog" class="preview-dialog decide-dialog" th:if="${box.name() == 'PENDING'}">
					<form method="post" th:action="@{/approval/bulk-approve}">
						<div class="preview-bar">
							<strong>일괄결재</strong>
							<span class="hint-inline" id="bulkHint"></span>
							<button type="button" class="btn-secondary" data-close>닫기</button>
						</div>
						<div class="decide-body">
							<label for="bulkComment">결재 의견 <span class="hint-inline">(선택, 모든 문서에 같이 남습니다)</span></label>
							<textarea id="bulkComment" name="comment" rows="4" maxlength="500"></textarea>
							<div id="bulkIds"></div>
						</div>
						<div class="picker-foot">
							<button type="button" class="btn-secondary" data-close>취소</button>
							<button type="submit" class="btn-primary">승인</button>
						</div>
					</form>
				</dialog>
			</section>
		</div>
	</main>
</div>
<script th:src="@{/js/approval-list.js}"></script>
</body>
</html>
