<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- 목록의 [결재상태 보기] 창 내용. 높은 사람이 위로 가도록 마지막 결재자부터 보여 준다 -->
<div th:fragment="panel">
	<section class="status-doc" th:each="d : ${docs}">
		<div class="status-doc-head">
			<span th:replace="~{approval/fragments :: status(${d.status})}"></span>
			<a th:href="@{/approval/docs/{id}(id=${d.id})}" th:text="${d.title}">제목</a>
			<span class="muted" th:text="${d.docNo} ?: '문서번호 없음'">품의-2026-0001</span>
		</div>
		<table class="status-table">
			<thead>
			<tr><th>단계</th><th>결재자</th><th>상태</th><th>처리일시</th><th>의견</th></tr>
			</thead>
			<tbody>
			<tr th:each="l : ${d.linesTopDown()}">
				<td class="status-step" th:text="${l.step} + '차'">1차</td>
				<td>
					<span th:text="${l.approverName}">김팀장</span>
					<span class="muted" th:text="${l.gradeName}">팀장</span>
					<span class="tag tag-info" th:if="${l.finalApproval}">전결</span>
					<span class="tag tag-info" th:if="${l.actedByName}" th:text="'대결 ' + ${l.actedByName}">대결</span>
				</td>
				<td class="status-state">
					<span class="doc-status" th:classappend="'line-' + ${#strings.toLowerCase(l.status.name())}" th:text="${l.status.label}">대기</span>
				</td>
				<td class="status-when" th:text="${l.displayActedAt()}">10.23 10:00</td>
				<td class="status-comment" th:text="${l.comment}">의견</td>
			</tr>
			<tr>
				<td class="status-step">기안</td>
				<td>
					<span th:text="${d.drafterName}">홍길동</span>
					<span class="muted" th:text="${d.drafterGrade}">대리</span>
				</td>
				<td class="status-state" th:text="${d.submittedAt != null} ? '상신' : '작성중'">상신</td>
				<td class="status-when" th:text="${d.submittedAt != null} ? ${#temporals.format(d.submittedAt, 'MM.dd HH:mm')} : ''">10.23 10:00</td>
				<td></td>
			</tr>
			</tbody>
		</table>
	</section>
</div>

</body>
</html>
