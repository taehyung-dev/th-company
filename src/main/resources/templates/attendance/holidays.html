<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('공휴일 관리')}"></head>
<body>
<header th:replace="~{fragments/layout :: topbar('attendance')}"></header>
<div class="layout">
	<main class="content">
		<div class="board-layout">
			<nav th:replace="~{attendance/fragments :: nav}"></nav>

			<section class="board-main">
				<div class="board-head">
					<div>
						<h2>공휴일 관리</h2>
						<p class="board-desc">공휴일은 결근으로 보지 않고, 휴가 일수에서도 빠집니다.</p>
					</div>
				</div>

				<div class="alert alert-info" th:if="${message}" th:text="${message}"></div>
				<div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

				<div class="month-nav">
					<a class="btn-secondary" th:href="@{/attendance/manage/holidays(year=${year - 1})}">‹ 이전 해</a>
					<strong th:text="${year} + '년'">2026년</strong>
					<a class="btn-secondary" th:href="@{/attendance/manage/holidays(year=${year + 1})}">다음 해 ›</a>
				</div>

				<form class="board-panel inline-form" th:action="@{/attendance/manage/holidays}" th:object="${form}" method="post">
					<div>
						<label for="date">날짜</label>
						<input type="date" th:field="*{date}" required>
					</div>
					<div class="grow">
						<label for="name">이름</label>
						<input type="text" th:field="*{name}" maxlength="50" placeholder="예: 추석, 대체공휴일, 창립기념일" required>
					</div>
					<button type="submit" class="btn-primary">추가</button>
					<p class="field-error" th:if="${#fields.hasErrors('date')}" th:errors="*{date}"></p>
					<p class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
				</form>

				<div class="board-panel">
					<table class="post-table">
						<thead>
						<tr><th class="col-day">날짜</th><th class="col-title">이름</th><th class="col-act"></th></tr>
						</thead>
						<tbody>
						<tr th:each="h : ${holidays}">
							<td class="col-day" th:text="${h.displayDate()}">2026.01.01 (목)</td>
							<td class="col-title">
								<span th:text="${h.name}">신정</span>
								<span class="tag tag-muted" th:if="${h.weekend()}">주말</span>
							</td>
							<td class="col-act">
								<form th:action="@{/attendance/manage/holidays/{id}/delete(id=${h.id})}" method="post"
								      th:attr="data-confirm=${h.name} + ' 공휴일을 삭제할까요?'" onsubmit="return confirm(this.dataset.confirm)">
									<input type="hidden" name="year" th:value="${year}">
									<button type="submit" class="btn-link danger">삭제</button>
								</form>
							</td>
						</tr>
						<tr th:if="${#lists.isEmpty(holidays)}">
							<td colspan="3" class="empty">등록된 공휴일이 없습니다.</td>
						</tr>
						</tbody>
					</table>
				</div>

				<form class="holiday-fixed" th:action="@{/attendance/manage/holidays/fixed}" method="post">
					<input type="hidden" name="year" th:value="${year}">
					<button type="submit" class="btn-secondary" th:text="${year} + '년 양력 공휴일 넣기'">2026년 양력 공휴일 넣기</button>
					<span class="hint-inline">신정, 삼일절, 어린이날, 현충일, 광복절, 개천절, 한글날, 성탄절을 넣습니다. 설날, 추석, 부처님오신날, 대체공휴일은 직접 추가하세요.</span>
				</form>
			</section>
		</div>
	</main>
</div>
</body>
</html>
