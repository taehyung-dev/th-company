<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- 첨부파일 입력 (form 은 multipart). 체크한 파일은 저장할 때 지운다 -->
<th:block th:fragment="edit(files, deleted)">
	<label>첨부파일 <span class="hint-inline">(최대 10개, 파일당 20MB)</span></label>
	<ul class="post-files edit" th:unless="${#lists.isEmpty(files)}">
		<li th:each="f : ${files}">
			<label class="check">
				<input type="checkbox" name="deleteFileIds" th:value="${f.id}" th:checked="${#lists.contains(deleted, f.id)}">
				<span th:text="${f.name}">파일.pdf</span>
				<span class="file-size" th:text="${f.displaySize()}">10 KB</span>
				<span class="hint-inline">삭제</span>
			</label>
		</li>
	</ul>
	<input type="file" name="uploads" multiple class="file-input">
</th:block>

<!-- 첨부파일 목록 -->
<ul th:fragment="view(files)" class="post-files" th:unless="${#lists.isEmpty(files)}">
	<li th:each="f : ${files}">
		<a th:href="@{/files/{id}(id=${f.id})}">
			<span>📎</span> <span th:text="${f.name}">파일.pdf</span>
		</a>
		<span class="file-size" th:text="${f.displaySize()}">10 KB</span>
	</li>
</ul>

</body>
</html>
