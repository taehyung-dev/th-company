<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>로그인 - TH Company</title>
	<link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="login-body">
<main class="login-card">
	<h1 class="login-logo">TH Company</h1>
	<p class="login-sub">그룹웨어에 로그인하세요</p>

	<div class="alert alert-error" th:if="${param.error}">아이디 또는 비밀번호가 올바르지 않습니다.</div>
	<div class="alert alert-info" th:if="${param.logout}">로그아웃되었습니다.</div>

	<form th:action="@{/login}" method="post" class="login-form">
		<label for="username">아이디</label>
		<input type="text" id="username" name="username" autocomplete="username" required autofocus>

		<label for="password">비밀번호</label>
		<input type="password" id="password" name="password" autocomplete="current-password" required>

		<button type="submit" class="btn-primary">로그인</button>
	</form>
</main>
</body>
</html>
