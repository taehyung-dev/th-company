<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('비밀번호 변경')}"></head>
<body>
<header th:replace="~{fragments/layout :: topbar('my')}"></header>
<div class="layout">
	<main class="content">
		<div class="board-layout">
			<nav th:replace="~{my/fragments :: nav}"></nav>

			<section class="board-main">
				<div class="board-head">
					<div>
						<h2>비밀번호 변경</h2>
						<p class="board-desc">영문과 숫자를 섞어 8자 이상으로 정하세요.</p>
					</div>
				</div>

				<div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

				<form class="board-panel post-form my-password" th:action="@{/my/password}" th:object="${form}" method="post">
					<label for="currentPassword">현재 비밀번호</label>
					<input type="password" th:field="*{currentPassword}" autocomplete="current-password" required>
					<p class="field-error" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></p>

					<label for="newPassword">새 비밀번호</label>
					<input type="password" th:field="*{newPassword}" autocomplete="new-password" minlength="8" maxlength="100" required>
					<p class="field-error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></p>

					<label for="confirmPassword">새 비밀번호 확인</label>
					<input type="password" th:field="*{confirmPassword}" autocomplete="new-password" maxlength="100" required>
					<p class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></p>

					<div class="form-buttons">
						<a class="btn-secondary" th:href="@{/my}">취소</a>
						<button type="submit" class="btn-primary">변경</button>
					</div>
				</form>
			</section>
		</div>
	</main>
</div>
</body>
</html>
