<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${form.id == null} ? '일정 등록' : '일정 수정')}"></head>
<body>
<header th:replace="~{fragments/layout :: topbar('schedule')}"></header>
<div class="layout">
	<main class="content">
		<div class="narrow">
			<div class="board-head">
				<h2 th:text="${form.id == null} ? '일정 등록' : '일정 수정'">일정 등록</h2>
			</div>

			<div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

			<form class="board-panel post-form" th:action="@{/schedule}" th:object="${form}" method="post" enctype="multipart/form-data">
				<input type="hidden" th:field="*{id}">

				<label>종류</label>
				<div class="type-choice">
					<label th:each="t : ${allowedTypes}" class="type-option" th:classappend="'sch-' + ${t.css}">
						<input type="radio" th:field="*{type}" th:value="${t}">
						<span class="legend-dot"></span>
						<span th:text="${t.label}">개인일정</span>
					</label>
				</div>

				<label for="title">제목</label>
				<input type="text" th:field="*{title}" maxlength="200" required>
				<p class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></p>

				<label class="check">
					<input type="checkbox" th:field="*{allDay}" id="allDay"> 종일
				</label>

				<div class="period">
					<div>
						<label for="startDate">시작</label>
						<div class="period-row">
							<input type="date" th:field="*{startDate}" required>
							<input type="time" th:field="*{startTime}" class="time-input" step="600">
						</div>
					</div>
					<div>
						<label for="endDate">종료</label>
						<div class="period-row">
							<input type="date" th:field="*{endDate}" required>
							<input type="time" th:field="*{endTime}" class="time-input" step="600">
						</div>
					</div>
				</div>
				<p class="field-error" th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}"></p>
				<p class="field-error" th:if="${#fields.hasErrors('endDate')}" th:errors="*{endDate}"></p>

				<label>참여자</label>
				<div class="cc-row attendee-row">
					<ul id="participantList" class="cc-inline">
						<li th:each="a : ${selectedParticipants}"
						    th:attr="data-id=${a.id},data-name=${a.name},data-grade=${a.grade},data-label=${a.label}">
							<input type="hidden" name="participantIds" th:value="${a.id}">
							<span class="line-name" th:text="${a.label}">홍길동</span>
						</li>
					</ul>
					<span class="hint-inline" id="participantEmpty">지정한 참여자가 없습니다.</span>
					<button type="button" class="btn-secondary" data-picker data-list="participantList" data-empty="participantEmpty"
					        data-input="participantIds" th:attr="data-max=${maxParticipants}" data-title="참여자 지정"
					        data-pane="참여자" data-tag="참여">참여자 지정</button>
				</div>
				<label class="check">
					<input type="checkbox" th:field="*{notifyParticipants}"> 참여자에게 알림 보내기
					<span class="hint-inline">이 일정을 보는 사람 모두에게 갑니다.</span>
				</label>

				<label for="description">내용</label>
				<textarea th:field="*{description}" rows="5" maxlength="2000"></textarea>

				<th:block th:replace="~{fragments/files :: edit(${files}, ${form.deleteFileIds})}"></th:block>

				<div class="form-buttons">
					<a class="btn-secondary" th:href="${form.id == null} ? @{/schedule} : @{/schedule/{id}(id=${form.id})}">취소</a>
					<button type="submit" class="btn-primary">저장</button>
				</div>
			</form>
		</div>
	</main>
</div>
<!-- 폼 밖에 둔다: 팝업의 검색칸에서 Enter 를 눌러도 일정이 저장되지 않게 -->
<dialog th:replace="~{approval/fragments :: picker}"></dialog>
<script th:src="@{/js/line-picker.js}"></script>
<script>
	// 종일이면 시간 입력 숨김, 시작일을 바꾸면 종료일이 더 빠르지 않게 맞춤
	(function () {
		var allDay = document.getElementById('allDay');
		var start = document.getElementById('startDate');
		var end = document.getElementById('endDate');
		function toggle() {
			document.querySelectorAll('.time-input').forEach(function (t) { t.style.display = allDay.checked ? 'none' : ''; });
		}
		allDay.addEventListener('change', toggle);
		start.addEventListener('change', function () {
			if (!end.value || end.value < start.value) end.value = start.value;
		});
		toggle();
	})();
</script>
</body>
</html>
